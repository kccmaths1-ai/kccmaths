body::before{content:"";position:fixed;inset:0;background:rgba(255,253,245,.78);z-index:0}
.sym{position:fixed;font:700 2rem serif;color:var(--gold);opacity:.35;z-index:0;animation:fl 12s linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--cream);border:3px solid var(--g);outline:3px solid var(--gold);outline-offset:3px;border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(11,77,44,.25);animation:pop .5s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
h1{font-size:clamp(1.6rem,6vw,2.4rem);margin:.2em 0;text-align:center;font-weight:800}
.sub{text-align:center;margin:0 0 14px;opacity:.85}
.logo{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-bottom:12px}
input{width:100%;font:inherit;font-size:1.15rem;padding:12px 14px;border:2px solid var(--g2);border-radius:12px;background:#fff;color:var(--g)}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold)}
button{font:inherit;font-weight:700;font-size:1.1rem;padding:12px 22px;border:0;border-radius:14px;background:var(--g);color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 4px 0 #062d19;transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:none}
button.alt{background:var(--gold);color:#2b2100;box-shadow:0 4px 0 #8a6d12}
.bar{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.bar span{background:var(--g);color:#fff;padding:4px 12px;border-radius:20px}
.prog{height:10px;background:#dcead9;border-radius:6px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold));transition:width .5s}
.q{font-size:1.2rem;line-height:1.8}
.fig{text-align:center;margin:10px 0;background:#fff;border-radius:12px;padding:8px}
.fig svg{max-width:100%;height:auto;max-height:200px}
svg text{font:700 13px sans-serif;fill:var(--g)}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 4px;line-height:1.3}
.fr i{font-style:normal;padding:0 4px}.fr i:first-child{border-bottom:2px solid currentColor}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:140px}
.msg{min-height:2.2em;font-weight:700;margin-top:10px}
.bad{color:var(--bad);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.slot{width:46px;height:50px;border:2px dashed var(--g2);border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:1.25rem;background:#fff}
.slot.on{border:2px solid var(--gold);background:var(--g);color:#fff;animation:flip .7s}
.slot small{font-size:.6rem;display:block;text-align:center;opacity:.6}
@keyframes flip{from{transform:rotateY(90deg) scale(.5)}to{transform:none}}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;text-align:center}
.st div{background:#fff;border:2px solid var(--gold);border-radius:12px;padding:8px;font-weight:800;font-size:1.3rem}
.st small{display:block;font-weight:400;font-size:.8rem}
.cf{position:fixed;font-size:1.6rem;z-index:9;pointer-events:none;animation:cf 1.2s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{margin:0;padding:6px 12px;font-size:.9rem;box-shadow:none;background:#e1f5e5;color:#0b4d2c;border:2px solid #1f7a45}.chip.on{background:#0b4d2c;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.tile{margin:0;text-align:left;background:#fff;color:#0b4d2c;border:2px solid #1f7a45;box-shadow:none;padding:8px 10px;font-size:.85rem;display:block;line-height:1.35}.tile b{font-size:1.1rem}.tile i{display:block;font-style:normal;margin-top:2px}
.key{background:#fff6d6;border:2px dashed #c9a227;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:800;text-align:center}
.ex{background:#e9f4ff;border-left:5px solid #3b82f6;border-radius:8px;padding:8px 12px;margin:10px 0}
.bd{background:#c62828;color:#fff;border-radius:12px;padding:2px 10px;font-size:.8rem;font-weight:700}
.hint{background:#fff6d6;border-left:5px solid #c9a227;padding:6px 10px;margin-top:6px;border-radius:6px}
.fig svg path,.fig svg circle{fill:none;stroke:#0b4d2c;stroke-width:2}.fig svg .f{fill:#e8f5e9}.fig svg text{stroke:#fff;stroke-width:3px;paint-order:stroke;font:700 13px sans-serif;fill:#0b4d2c}.fig svg text.qm{fill:#c62828;font-size:19px}.fig svg{max-height:230px}
.sm{font-size:.9rem;opacity:.85}

<script>
const D=Math.PI/180,f1=v=>(+v).toFixed(1),PT=p=>f1(p[0])+' '+f1(p[1]);
const P=(c,r,a)=>[c[0]+r*Math.cos(a*D),c[1]-r*Math.sin(a*D)],AN=(p,q)=>Math.atan2(p[1]-q[1],q[0]-p[0])/D,M2=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
const L=(...p)=>`<path d="M${p.map(PT).join('L')}"/>`,Fl=(...p)=>`<path class="f" d="M${p.map(PT).join('L')}Z"/>`;
const X=(p,t,c='')=>`<text x="${f1(p[0])}" y="${f1(p[1]+4)}" text-anchor="middle" class="${c}">${t}</text>`,V=(p,t,a,d=13)=>X(P(p,d,a),t);
const K=(a,b,n=1)=>{const m=M2(a,b),d=AN(a,b);let s='';for(let i=0;i<n;i++){const c=P(m,(i-(n-1)/2)*5,d);s+=L(P(c,6,d+90),P(c,6,d-90))}return s};

// ===== ප්‍රශ්න උත්පාදක: GEN[n](v) → [ප්‍රශ්නය, පිළිතුර (පූර්ණ සංඛ්‍යාව), ඉඟිය/විසඳුම, රූපය] =====
const RN=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[RN(0,a.length-1)],sg=v=>(v<0?'− ':'+ ')+Math.abs(v);
const EX=(xm=30,pm=4,qs=[5,10,15,20])=>{for(;;){const x=RN(10,xm),p=RN(2,pm),u=RN(1,3),r=p+u,q=pk(qs),val=p*x+q,s=q-u*x;if(s!==0&&val>=20)return{x,val,A:`(${p}x + ${q})`,B:`(${r}x ${sg(s)})`}}};
const S180=(tot,xm=25)=>{for(;;){const x=RN(10,xm),p=RN(2,3),r=RN(2,3),q=RN(5,15),s=tot-(p+r)*x-q;if(s!==0&&p*x+q<tot-10)return{x,A:`(${p}x + ${q})`,B:`(${r}x ${sg(s)})`}}};
const TRP=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10]],tp=()=>{const[a,b,c]=pk(TRP),k=RN(1,2);return a>12?[a,b,c]:[a*k,b*k,c*k]};
const GEN={};
GEN[1]=v=>{if(v==0){const a=RN(35,145);return[`රූපයේ සරල රේඛාවක් මත සෑදුණු බද්ධ කෝණ දෙකකි. එක් කෝණයක් ${a}° නම් අනෙක් කෝණය (අංශක) සොයන්න.`,180-a,`බද්ධ කෝණ ඓක්‍යය 180° (ප්‍රමේයය 01): 180 − ${a}.`,FL(a+'°','?')]}
if(v==1){const[m,n]=pk([[2,1],[3,2],[4,1],[5,1],[7,2],[5,4]]),k=180/(m+n);return[`සරල රේඛාවක් මත සෑදුණු බද්ධ කෝණ දෙක ${m} : ${n} අනුපාතයෙන් පවතී. විශාල කෝණයේ අගය (අංශක) සොයන්න.`,m*k,`${m}k + ${n}k = 180° ⇒ k = ${k}. විශාල කෝණය = ${m}k.`,FL(m+'k°',n+'k°')]}
const x=RN(10,30),p=RN(2,4),q=RN(5,20),a=p*x+q;return[`රූපයේ සරල රේඛාවක් මත කෝණ (${p}x + ${q})° හා ${180-a}° වේ. x හි අගය සොයන්න.`,x,`(${p}x + ${q}) + ${180-a} = 180 ⇒ ${p}x = ${a-q}.`,FL(`(${p}x+${q})°`,(180-a)+'°')]};
GEN[2]=v=>{const a=RN(35,145);if(v==0)return[`රේඛා දෙකක් ඡේදනය වීමෙන් සෑදුණු කෝණවලින් එකක් ${a}° නම්, එයට ප්‍රතිමුඛ (ඉදිරිපිට) කෝණය (අංශක) සොයන්න.`,a,`ප්‍රතිමුඛ කෝණ සමානයි (ප්‍රමේයය 02).`,FX(a+'°','','?','')];
if(v==1)return[`රේඛා දෙකක් ඡේදනය වීමෙන් සෑදුණු එක් කෝණයක් ${a}° නම්, එයට බද්ධව පිහිටි (අසල) කෝණය (අංශක) සොයන්න.`,180-a,`බද්ධ කෝණ ඓක්‍යය 180° (ප්‍රමේයය 01): 180 − ${a}.`,FX(a+'°','?','','')];
const e=EX();return[`රූපයේ ප්‍රතිමුඛ කෝණ ${e.A}° හා ${e.B}° වේ. x හි අගය සොයන්න.`,e.x,`ප්‍රතිමුඛ කෝණ සමානයි: ${e.A} = ${e.B}.`,FX(e.A+'°','',e.B+'°','')]};
GEN[3]=v=>{const a=RN(35,145);if(v==0){const e=EX();return[`AB ∥ CD වේ. ඡේදකයෙන් සෑදෙන අනුරූප කෝණ ${e.A}° හා ${e.B}° නම් x හි අගය සොයන්න.`,e.x,`අනුරූප කෝණ සමානයි (ප්‍රමේයය 03): ${e.A} = ${e.B}.`,FP('ur',e.A+'°','ur',e.B+'°')]}
if(v==1)return[`AB ∥ CD වේ. ඒකාන්තර කෝණ යුගලයක එක් කෝණයක් ${a}° නම්, අනෙක් ඒකාන්තර කෝණය (අංශක) සොයන්න.`,a,`ඒකාන්තර කෝණ සමානයි (ප්‍රමේයය 03).`,FP('ll',a+'°','ur','?')];
return[`AB ∥ CD වේ. මිත්‍ර කෝණ යුගලයක එක් කෝණයක් ${a}° නම්, අනෙක් මිත්‍ර කෝණය (අංශක) සොයන්න.`,180-a,`මිත්‍ර කෝණ ඓක්‍යය 180°: 180 − ${a}.`,FP('lr',a+'°','ur','?')]};
GEN[4]=v=>{if(v==0){const e=EX();return[`රූපයේ අනුරූප කෝණ ${e.A}° හා ${e.B}° වේ. AB ∥ CD වීමට x හි අගය කීයද?`,e.x,`අනුරූප කෝණ සමාන වීමෙන් රේඛා සමාන්තර වේ (ප්‍රමේයය 04): ${e.A} = ${e.B}.`,FP('ur',e.A+'°','ur',e.B+'°')]}
if(v==1){const e=EX();return[`රූපයේ ඒකාන්තර කෝණ ${e.A}° හා ${e.B}° වේ. AB ∥ CD වීමට x හි අගය කීයද?`,e.x,`ඒකාන්තර කෝණ සමාන නම් රේඛා සමාන්තරයි: ${e.A} = ${e.B}.`,FP('ll',e.A+'°','ur',e.B+'°')]}
const x=RN(10,25),p=RN(2,4),q=RN(5,15),a=p*x+q;return[`රූපයේ මිත්‍ර කෝණ (${p}x + ${q})° හා ${180-a}° වේ. AB ∥ CD වීමට x හි අගය කීයද?`,x,`මිත්‍ර කෝණ ඓක්‍යය 180° නම් රේඛා සමාන්තරයි: (${p}x + ${q}) + ${180-a} = 180.`,FP('lr',`(${p}x+${q})°`,'ur',(180-a)+'°')]};
const LEG='(1 = පා.කෝ.පා, 2 = කෝ.පා.කෝ, 3 = කෝ.කෝ.පා, 4 = කර්ණ.පා, 5 = පා.පා.පා)',HT=['','පාද 2ක් හා ඒවා අතර කෝණය සලකුණු කර ඇත (පා.කෝ.පා).','කෝණ 2ක් හා ඒවා අතර පාදය සලකුණු කර ඇත (කෝ.පා.කෝ).','කෝණ 2ක් හා ඒවා අතර නොවන පාදයක් සලකුණු කර ඇත (කෝ.කෝ.පා).','සෘජුකෝණය, කර්ණය හා පාදයක් සලකුණු කර ඇත (කර්ණ.පා).','පාද තුනම සලකුණු කර ඇත (පා.පා.පා).'];

const GRP=['රේඛා හා කෝණ','අංගසම ත්‍රිකෝණ','ත්‍රිකෝණ හා බහුඅස්‍ර','සමාන්තරාස්‍රය','මධ්‍ය ලක්ෂ්‍ය හා වර්ගඵල','අනුපාත හා සමකෝණිකතාව','වෘත්තය'];
const gOf=n=>n<=4?0:n<=8?1:n<=13?2:n<=19?3:n<=26?4:n<=30?5:6,PROOF=new Set([2,9,10,12,14,20,31,33,36]);
const fr=s=>s.replace(/\[\[(.+?)\|(.+?)\]\]/g,'<span class="fr"><i>$1</i><i>$2</i></span>');
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='thmStars',ld=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}},sv=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}};
let name='',flt=-1,snd=true,au;
function tn(f,d,ty='sine',v=.2,dl=0){if(!snd)return;try{au=au||new(window.AudioContext||window.webkitAudioContext)();au.resume();const o=au.createOscillator(),g=au.createGain(),t=au.currentTime+dl;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(au.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const ok=()=>[523,659,784,1046].forEach((f,i)=>tn(f,.25,'triangle',.22,i*.09)),bad=()=>{tn(150,.3,'sawtooth',.2);tn(110,.35,'sawtooth',.2,.12)},win=()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tn(f,.3,'triangle',.25,i*.14));
['∑','π','√','∫','%','x²','∠','÷','△','½'].forEach((c,k)=>{const e=document.createElement('div');e.className='sym';e.textContent=c;e.style.left=(k*10+3)+'%';e.style.animationDelay=(-k*1.3)+'s';e.style.animationDuration=(10+k*1.5)+'s';document.body.appendChild(e)});
function burst(){for(let k=0;k<16;k++){const e=document.createElement('div');e.className='cf';e.textContent=['✨','⭐','🎉','📐'][k%4];e.style.left='50%';e.style.top='40%';e.style.setProperty('--x',(Math.random()*500-250)+'px');e.style.setProperty('--y',(Math.random()*400-250)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}}
const stars=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
function home(){const S=ld(),tot=Object.values(S).reduce((a,b)=>a+b,0),done=Object.values(S).filter(v=>v>0).length;
app.innerHTML=`<div class="card"><h1>ජ්‍යාමිතික ප්‍රමේයයන් 📐</h1><p class="sub">Kiriella Central College · Maths Spark '26 · Maths Unit</p>
<p style="text-align:center">ප්‍රමේයයක් තෝරන්න → සරලව කියවන්න → උදාහරණය බලන්න → ප්‍රශ්න 3ක් විසඳන්න. ඔබේ පිළිතුරු ස්වයංක්‍රීයව පරීක්ෂා වේ!</p>
<label for="nm" style="font-weight:700">ඔබේ නම</label><input id="nm" maxlength="40" value="${esc(name)}" autocomplete="off">
<div class="bar" style="margin-top:10px"><span>⭐ ${tot} / 126</span><span>ප්‍රමේයය ${done} / 42</span><button id="sn" class="chip">${snd?'🔔':'🔕'}</button></div>
<div class="chips"><button class="chip ${flt<0?'on':''}" data-g="-1">සියල්ල</button>${GRP.map((g,i)=>`<button class="chip ${flt==i?'on':''}" data-g="${i}">${g}</button>`).join('')}</div>
<div class="grid">${TH.map((t,n)=>n&&(flt<0||gOf(n)==flt)?`<button class="tile" data-n="${n}"><b>${String(n).padStart(2,'0')}</b> ${t[0]}<i>${stars(S[n]||0)}</i></button>`:'').join('')}</div>
<button id="rp" class="alt">📋 ප්‍රගති වාර්තාව copy කරන්න</button><div id="m" class="msg"></div></div>`;
$('#nm').oninput=e=>{name=e.target.value};$('#sn').onclick=()=>{snd=!snd;ok();home()};
document.querySelectorAll('.chip[data-g]').forEach(b=>b.onclick=()=>{flt=+b.dataset.g;home()});
document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>thm(+b.dataset.n));
$('#rp').onclick=()=>{const txt=`${name||'ශිෂ්‍යයා'} | ⭐ ${tot}/126 | `+TH.map((t,n)=>n?n+':'+(S[n]||0):'').filter(Boolean).join(' ');try{navigator.clipboard.writeText(txt);$('#m').textContent='Copy වුණා ✔'}catch(e){$('#m').textContent=txt}}}
function thm(n){const t=TH[n],ex=GEN[n](0);
app.innerHTML=`<div class="card"><div class="bar"><span>ප්‍රමේයය ${n}</span><span>${GRP[gOf(n)]}</span>${PROOF.has(n)?'<span class="bd">සාධනය අවශ්‍යයි</span>':''}</div>
<h2>${t[0]}</h2><p class="q">${fr(t[1])}</p><div class="key">📌 මතක තබාගන්න: ${fr(t[2])}</div>
<div class="ex"><b>📖 උදාහරණය</b><div class="q">${fr(ex[0])}</div>${ex[3]?`<div class="fig">${ex[3]}</div>`:''}<div class="hint">✔ විසඳුම: ${fr(ex[2])}<br><b>පිළිතුර: ${ex[1]}</b></div></div>
<button id="go">✏️ ප්‍රශ්න 3ක් විසඳමු!</button> <button id="bk" class="alt">← ආපසු</button></div>`;
$('#go').onclick=()=>prac(n);$('#bk').onclick=home;window.scrollTo(0,0)}
function prac(n){const qs=[0,1,2].map(v=>GEN[n](v));let i=0,pts=0,got=0,tries=0;
function show(){tries=0;const q=qs[i];app.innerHTML=`<div class="card"><div class="bar"><span>ප්‍රමේයය ${n}</span><span>ප්‍රශ්නය ${i+1} / 3</span><span>⭐ ${got}</span></div><div class="prog"><i style="width:${i/3*100}%"></i></div>
<div class="q"><b>${i+1}.</b> ${fr(q[0])}</div>${q[3]?`<div class="fig">${q[3]}</div>`:''}
<div class="row"><input id="ans" inputmode="numeric" autocomplete="off" placeholder="පිළිතුර (පූර්ණ සංඛ්‍යාවක්)"><button id="ck">පරීක්ෂා කරන්න ✔</button></div><div id="m" class="msg"></div>
<button id="rd" class="alt">📖 ප්‍රමේයය නැවත කියවන්න</button></div>`;const a=$('#ans');a.focus();a.onkeydown=e=>{if(e.key==='Enter')chk()};$('#ck').onclick=chk;$('#rd').onclick=()=>{const t=TH[n];$('#m').innerHTML=`<div class="hint"><b>${t[0]}:</b> ${fr(t[1])}<br>📌 ${fr(t[2])}</div>`}}
function nxt(){$('#ans').disabled=true;$('#ck').outerHTML=`<button id="nx" class="alt">${i==2?'ප්‍රතිඵලය බලන්න 🏆':'ඊළඟ ප්‍රශ්නය ➡️'}</button>`;$('#nx').onclick=()=>{i++;i>=3?fin():show()};$('#nx').focus()}
function chk(){const v=$('#ans').value.trim(),m=$('#m'),q=qs[i];if(!/^-?\d+$/.test(v)){m.className='msg bad';m.textContent='පූර්ණ සංඛ්‍යාවක් පමණක් ඇතුළත් කරන්න';return}
if(+v===q[1]){const p=[10,6,3][tries];pts+=p;got++;ok();burst();m.className='msg';m.innerHTML=`🎉 නිවැරදියි! +${p} ලකුණු<div class="hint">✔ ${fr(q[2])}</div>`;nxt()}
else{tries++;bad();m.className='msg';void m.offsetWidth;m.className='msg bad';if(tries>=3){m.innerHTML=`❌ නිවැරදි පිළිතුර: <b>${q[1]}</b><div class="hint">💡 ${fr(q[2])}</div>`;nxt()}else m.innerHTML='❌ වැරදියි, නැවත උත්සාහ කරන්න ('+tries+')'+(tries>=2?`<div class="hint">💡 ඉඟිය: ${fr(q[2].split('⇒')[0].split('=')[0])} …</div>`:'')}}
function fin(){const S=ld();S[n]=Math.max(S[n]||0,got);sv(S);if(got==3){win();for(let k=0;k<3;k++)setTimeout(burst,k*400)}
app.innerHTML=`<div class="card"><h1>${got==3?'🎊 විශිෂ්ටයි!':'හොඳයි!'}</h1><p class="sub">ප්‍රමේයය ${n} · ${TH[n][0]}</p><div class="st"><div>${stars(got)}<small>තරු</small></div><div>${pts} / 30<small>ලකුණු</small></div></div>
<p style="text-align:center">${got==3?'සියලු ප්‍රශ්න නිවැරදියි!':'ප්‍රමේයය නැවත කියවා ආයෙත් උත්සාහ කරන්න — ප්‍රශ්නවල අංක අලුතින් එයි!'}</p>
<div style="text-align:center"><button id="rt">🔁 නැවත උත්සාහ කරන්න</button> ${n<42?`<button id="nt" class="alt">ඊළඟ ප්‍රමේයය ➡️</button>`:''} <button id="hm" class="alt">🏠 ප්‍රමේයයන් ලැයිස්තුව</button></div></div>`;
$('#rt').onclick=()=>thm(n);$('#hm').onclick=home;if($('#nt'))$('#nt').onclick=()=>thm(n+1)}
show()}
home();
</script></body></html>
