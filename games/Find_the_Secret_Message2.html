body::after{content:"";position:fixed;inset:0;background:var(--ov);z-index:-1;opacity:.93;transition:opacity .6s}
body.home::after{opacity:.0}
[hidden]{display:none!important}
.fl{position:fixed;bottom:-40px;font-size:28px;color:var(--au);opacity:.5;z-index:-1;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.wrap{max-width:980px;margin:0 auto;padding:14px}
#s1{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end}
.card0{background:var(--ov);border:2px solid var(--au);border-radius:22px;padding:22px;margin-bottom:18px;animation:pop .7s;backdrop-filter:blur(6px)}
.card0 h2{margin:0 0 4px;font-size:22px;color:var(--g)}.card0 p{margin:0 0 14px;opacity:.8;font-size:14px}
input,textarea{width:100%;padding:13px 14px;border:2px solid var(--bd);border-radius:12px;font:inherit;background:var(--c);color:var(--tx);margin-bottom:10px}
input:focus,textarea:focus{outline:none;border-color:var(--g2)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:600;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0003}
.pri{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;width:100%;font-size:17px}
.sec{background:var(--c);color:var(--g);border:2px solid var(--g)}.gold{background:var(--au);color:#2b2200}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--c);border:2px solid var(--au);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.top b{color:var(--g)}.pill{background:var(--g);color:#fff;border-radius:99px;padding:5px 14px;font-weight:600}
#tm{font-variant-numeric:tabular-nums;font-size:20px}
.steps{display:flex;gap:6px;margin-bottom:12px}.steps i{flex:1;height:10px;border-radius:9px;background:var(--bd);transition:.4s}
.steps i.d{background:var(--g2)}.steps i.n{background:var(--au);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scaleY(1.7)}}
.clue{background:var(--c);border-left:8px solid var(--g);border-radius:16px;padding:16px;margin-bottom:12px;animation:pop .5s}
.clue h3{margin:0 0 6px;color:var(--g)}.clue p{margin:0;line-height:1.55}
#hint{margin-top:10px;padding:10px;border-radius:10px;background:#c9a22722;border:1px dashed var(--au)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btns button{flex:1;min-width:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.sus{background:var(--c);border:3px solid var(--bd);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;transition:.2s;user-select:none}
.sus:hover{transform:translateY(-4px) rotate(-1deg)}.sus .e{font-size:38px}.sus .n{font-weight:800;font-size:15px;margin:4px 0}
.sus.sel{border-color:#d33;background:#d3333318;transform:scale(1.04)}.sus.sel .n{text-decoration:line-through;color:#d33}
.dots{display:flex;gap:4px;justify-content:center;margin-top:6px}.dots u{width:11px;height:11px;border-radius:50%;background:var(--bd)}
.dots u.x{background:#d33}.dots u.ok{background:var(--g2)}
.sus.cul{border-color:var(--au);box-shadow:0 0 0 4px #c9a22744}
.shake{animation:sh .45s}@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:var(--g);color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;transition:.4s;z-index:20}
#toast.on{transform:translate(-50%,0)}#toast.bad{background:#c0392b}
#mod{position:fixed;inset:0;background:#000c;z-index:30;overflow:auto;padding:14px;text-align:center}
#mod img{width:min(900px,100%);border-radius:10px;background:#fff}
#mod button{position:sticky;top:0;margin-bottom:8px;background:var(--au)}
