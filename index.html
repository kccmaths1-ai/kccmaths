<title>Maths Spark '26 – KCC Maths Camp</title>

<style>
:root{
  --paper:#faf8f0; --card:#ffffff; --ink:#17301f; --muted:#5b6b60;
  --green:#0f5b2e; --gold:#b8932f; --line:#e4dfc9;
  --c-escape:#23407a; --c-detective:#6b3a7d; --c-puzzle:#0e7c7b;
  --c-geo:#b83a5a; --c-theorem:#0f5b2e; --c-team:#9a6a12;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI",system-ui,sans-serif;line-height:1.6;
  -webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* banner */
.banner{padding:16px 16px 0}
.banner img{display:block;width:100%;height:auto;border-radius:18px;border:2px solid var(--gold);
  box-shadow:0 10px 30px -14px rgba(15,91,46,.45)}
.intro{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding:22px 0 8px}
.intro h1{margin:0;font-size:clamp(1.4rem,3.2vw,2rem);font-weight:800;color:var(--green);line-height:1.3}
.intro p{margin:4px 0 0;color:var(--muted);max-width:52ch}
.surprise{border:0;cursor:pointer;font:inherit;font-weight:800;color:#fff;background:var(--green);
  padding:14px 22px;border-radius:14px;box-shadow:0 4px 0 #093a1d;min-height:48px}
.surprise:active{transform:translateY(3px);box-shadow:0 1px 0 #093a1d}

/* sticky nav */
.bar{position:sticky;top:0;z-index:20;background:rgba(250,248,240,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-top:10px;padding-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 14px;border-radius:999px;
  background:#fff;border:2px solid var(--c);color:var(--c);white-space:nowrap}
.chip:hover{background:var(--c);color:#fff}
.search{flex:none;width:190px;font:inherit;font-size:.95rem;padding:9px 14px;border-radius:999px;
  border:2px solid var(--line);background:#fff;color:var(--ink)}
.search:focus{border-color:var(--gold);outline:none}

/* sections */
section{padding:34px 0 6px}
.head{display:flex;gap:14px;align-items:center;margin-bottom:16px;padding-left:14px;border-left:8px solid var(--c)}
.head .ico{font-size:2rem;line-height:1}
.head h2{margin:0;font-size:1.45rem;font-weight:800;color:var(--c);line-height:1.3}
.head p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.head .n{margin-left:auto;font-weight:800;color:var(--c);font-size:.9rem;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border-radius:16px;overflow:hidden;
  border:1px solid var(--line);border-bottom:5px solid var(--c);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.card .pic{position:relative;aspect-ratio:16/9;background:#e9e5d2;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tag{position:absolute;left:10px;bottom:10px;background:var(--c);color:#fff;font-size:.78rem;font-weight:600;
  padding:2px 10px;border-radius:999px}
.card .txt{padding:12px 14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:1.08rem;font-weight:800;line-height:1.35}
.card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.55;flex:1}
.card .go{margin-top:8px;font-weight:800;color:var(--c);font-size:.95rem}
.none{display:none;text-align:center;color:var(--muted);padding:40px 0}
footer{margin-top:46px;padding:26px 0 40px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.9rem}
footer b{color:var(--green)}

@media (max-width:640px){
  .search{width:120px}
  .head .n{display:none}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>

const main = document.getElementById('main'), chips = document.getElementById('chips');
const href = f => 'games/' + f + (f === 'Geometry_Treasure_Hunt' ? '/index.html' : '.html');

CATS.forEach(cat => {
  const items = G.filter(g => g[0] === cat.id);
  chips.insertAdjacentHTML('beforeend',
    `<a class="chip" href="#${cat.id}" style="--c:var(${cat.c})">${cat.ico} ${cat.title}</a>`);
  main.insertAdjacentHTML('beforeend', `
  <section id="${cat.id}" style="--c:var(${cat.c})">
    <div class="head"><span class="ico" aria-hidden="true">${cat.ico}</span>
      <div><h2>${cat.title}</h2><p>${cat.desc}</p></div>
      <span class="n">ගේම් ${items.length}</span></div>
    <div class="grid">${items.map(g => `
      <a class="card" href="${href(g[1])}" data-s="${(g[2]+' '+g[3]).toLowerCase()}">
        <div class="pic"><img src="img/${g[1]}.jpg" alt="" loading="lazy" width="640" height="360"><span class="tag">${g[4]}</span></div>
        <div class="txt"><h3>${g[2]}</h3><p>${g[3]}</p><span class="go">සෙල්ලම් කරන්න ▶</span></div>
      </a>`).join('')}
    </div>
  </section>`);
});

// search
const q = document.getElementById('q'), none = document.getElementById('none');
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase(); let any = false;
  document.querySelectorAll('section').forEach(sec => {
    let n = 0;
    sec.querySelectorAll('.card').forEach(c => {
      const show = !t || c.dataset.s.includes(t); c.style.display = show ? '' : 'none'; if (show) n++;
    });
    sec.style.display = n ? '' : 'none'; if (n) any = true;
  });
  none.style.display = any ? 'none' : 'block';
});

// random game
document.getElementById('rand').addEventListener('click', () => {
  location.href = href(G[Math.floor(Math.random() * G.length)][1]);
});
